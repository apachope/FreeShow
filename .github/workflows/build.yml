name: Build Installers
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  version:
    name: Determine release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Generate Taiwan date and daily build number
        id: version
        uses: actions/github-script@v8
        with:
          script: |
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.runId
            });
            // Use the original run creation time so retries keep the same version.
            const date = new Date(Date.parse(run.created_at) + 8 * 60 * 60 * 1000)
              .toISOString().slice(0, 10);
            const start = new Date(`${date}T00:00:00+08:00`);
            const end = new Date(start.getTime() + 24 * 60 * 60 * 1000 - 1);
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              workflow_id: run.workflow_id,
              created: `${start.toISOString()}..${end.toISOString()}`,
              per_page: 100
            });
            const dailyNumber = run.run_number - Math.min(run.run_number,
              ...runs.map(item => item.run_number)) + 1;
            const upstream = require('./package.json').version.replace(/[-.]apachope\..*$/, '');
            const separator = upstream.includes('-') ? '.' : '-';
            const version = `${upstream}${separator}apachope.${date.replaceAll('-', '')}.${dailyNumber}`;
            core.setOutput('version', version);
            await core.summary.addHeading('Installer version').addRaw(version).write();

  build:
    needs: version
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            args: --win --x64
            artifact: FreeShow-Windows-x64
            files: dist/*.exe
          - name: macOS Intel
            os: macos-15-intel
            args: --mac --x64
            artifact: FreeShow-macOS-x64
            files: |
              dist/*.dmg
              dist/*.zip
          - name: macOS Apple Silicon
            os: macos-15
            args: --mac --arm64
            artifact: FreeShow-macOS-arm64
            files: |
              dist/*.dmg
              dist/*.zip

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js and NPM
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build tools
        run: python -m pip install setuptools

      - name: Install dependencies
        run: npm ci

      - name: Apply release version
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts
        shell: bash

      - name: Build installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release:local -- ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ needs.version.outputs.version }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
